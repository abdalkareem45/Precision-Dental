<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precision Dental — Oral Medicine Explorer</title>
    <meta
      name="description"
      content="Immersive interactive simulation-based Oral Medicine learning platform by Precision Dental featuring 10 visual lectures, 3D exploration labs, 2D clinical sandboxes, and patient cases."
    />
    <meta property="og:title" content="Precision Dental — Oral Medicine Explorer" />
    <meta
      property="og:description"
      content="Interactive 3D & 2D clinical simulations, diagnostic decision trees, virtual patient cases, and histopathology learning across 10 Oral Medicine lectures."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('precision_dental_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F3] text-[#0B1F4D] dark:bg-[#0B1220] dark:text-[#F9FAFB] antialiased selection:bg-[#1B3A8C]/20 dark:selection:bg-[#3B82F6]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
